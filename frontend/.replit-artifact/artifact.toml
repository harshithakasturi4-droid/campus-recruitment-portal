kind = "web"
previewPath = "/"
title = "PlaceMate"
description = "A responsive campus placement and career intelligence frontend for students, recruiters, and placement administrators, with role-specific dashboards and a clearly labeled demo mode."
version = "1.0.0"
id = "frontend"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19782

[services.development]
run = "pnpm --filter @workspace/placemate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/placemate", "run", "build" ]
serve = "static"
publicDir = "frontend/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
FRONTEND_PORT = "19782"
BASE_PATH = "/"
HOST = "0.0.0.0"
DEV_ALLOWED_HOSTS = "localhost,127.0.0.1,.replit.dev,.replit.app"
VITE_API_BASE_URL = ""
